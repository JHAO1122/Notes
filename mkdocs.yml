site_name: Jiahao's Academic Space
site_url: https://jhao1122.github.io/Notes/ 
repo_url: https://github.com/jhao1122/Notes   
repo_name: jhao1122/Notes

# ================= 主题配置 =================
theme:
  name: material
  custom_dir: overrides
  language: zh 
  icon:
    repo: fontawesome/brands/github
    back_to_top: material/rocket-launch
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - content.code.copy

  # ⬇️ 直接复制以下这段覆盖你原来的 palette 部分 ⬇️
  palette: 
    # 第一项：深色模式 (移除了 media 限制，强制作为默认加载)
    - scheme: slate
      primary: black
      accent: white
      toggle:
        icon: material/brightness-4
        title: 切换到浅色模式

    # 第二项：浅色模式 (作为备选切换)
    - scheme: default
      primary: white
      accent: grey
      toggle:
        icon: material/brightness-7
        title: 切换到深色模式
# ================= 插件配置 =================
plugins:
  - search
  - i18n:
      docs_structure: folder    # ⭐ 核心：对应你现在的 docs/zh 和 docs/en 结构
      fallback_to_default: true
      languages:
